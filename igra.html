const FONT_PALETTES = {};
function drawTextRaw(g, str, x, y, color, s) {
  s = s || 1;
  g.fillStyle = color;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const gl = FONT[ch];
    if (!gl) { cx += 6 * s; continue; }
    for (let r = 0; r < 7; r++) {
      const row = gl.substr(r * 5, 5);
      for (let c = 0; c < 5; c++) {
        if (row[c] === '1') g.fillRect(cx + c * s, y + r * s, s, s);
      }
    }
    cx += 6 * s;
  }
  return cx - x;
}
function textW(str, s) { return str.length * 6 * (s || 1) - (s || 1); }
function drawText(g, str, x, y, color, s) {
  drawTextRaw(g, str, x, y, color, s);
}
// текст с тенью
function drawTextS(g, str, x, y, color, s, shadow) {
  s = s || 1;
  drawTextRaw(g, str, x + s, y + s, shadow || '#000', s);
  drawTextRaw(g, str, x, y, color, s);
}
// центрирование
function textC(g, str, y, color, s) {
  s = s || 1;
  drawText(g, str, Math.round((W - textW(str, s)) / 2), y, color, s);
}
function textCS(g, str, y, color, s, shadow) {
  s = s || 1;
  drawTextS(g, str, Math.round((W - textW(str, s)) / 2), y, color, s, shadow);
}

/* ---------- УТИЛИТЫ ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let s = Math.min(vw / W, vh / H);
  if (s >= 2) s = Math.floor(s);           // целочисленный масштаб на десктопе
  s = Math.max(0.8, s);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();
/* ============================================================
   Часть 2: спрайты и процедурная графика (NES-палитра)
   ============================================================ */
function spr(rows, map) {
  const h = rows.length, w = rows[0].length;
  const c = mkCanvas(w, h);
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch !== '.') { g.fillStyle = map[ch] || '#f0f'; g.fillRect(x, y, 1, 1); }
    }
  }
  return c;
}
function flipH(c) {
  const f = mkCanvas(c.width, c.height);
  const g = f.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1);
  g.drawImage(c, 0, 0);
  return f;
}

function drawSky(g, bands, horizonY, palette) {
  const n = bands.length;
  for (let i = 0; i < n; i++) {
    const y0 = Math.round(horizonY * i / n);
    const y1 = Math.round(horizonY * (i + 1) / n);
    g.fillStyle = palette[i];
    g.fillRect(0, y0, W, y1 - y0);
  }
  g.fillStyle = palette[palette.length - 1];
  g.fillRect(0, horizonY, W, H - horizonY);
}

/* ---------- ТОПОЛЬ (голый, ноябрь) ---------- */
function makePoplar(seed) {
  const c = mkCanvas(40, 110);
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  g.strokeStyle = '#12101c'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(20, 110); g.lineTo(19, 40); g.stroke();
  g.lineWidth = 1;
  const branch = (x, y, dir, len, depth) => {
    if (depth > 3 || len < 3) return;
    const dx = dir * (2 + rnd() * 4), dy = -(4 + rnd() * 7);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.stroke();
    branch(x + dx, y + dy, dir, len - 1, depth + 1);
    if (rnd() < 0.5) branch(x + dx, y + dy, -dir, len - 1, depth + 1);
  };
  for (let i = 0; i < 7; i++) {
    const y = 38 + i * 9;
    branch(19, y, i % 2 ? 1 : -1, 3, 0);
  }
  // редкие жёлтые листья

/* ---------- ноты ---------- */
function hz(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  const acc = m[2] === '#' ? 1 : (m[2] === 'b' ? -1 : 0);
  const midi = 12 * (+m[3] + 1) + base + acc;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* ---------- шумовой буфер ---------- */
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf) {
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

/* ---------- СЕКВЕНСОР ---------- */
/* track: {wave:'square'|'triangle'|'noise', duty, vol, echo, vib, kind:'tone'|'hat'|'snare'|'kick'|'swell',
           ev: [[step, 'D4', durSteps], ...]} */
const SEQ = {
  song: null, step: 0, next: 0, timer: null, playing: false,
  play(song) {
    this.stop();
    if (!audioCtx) return;
    this.song = song;
    this.step = 0;
    this.next = audioCtx.currentTime + 0.08;
    this.playing = true;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() {
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.song = null;
  },
  tick() {
    if (!this.playing || !audioCtx || !this.song) return;
    const spb = 60 / this.song.bpm / 4; // длительность 1/16
    while (this.next < audioCtx.currentTime + 0.14) {
      const s = this.step;
      for (const tr of this.song.tracks) {
        for (const ev of tr.ev) {
          if (ev[0] === s) this.note(tr, ev, this.next, ev[2] * spb);
        }
      }
      this.next += spb;
      this.step = (this.step + 1) % this.song.len;
    }
  },
  note(tr, ev, when, dur) {
    if (tr.kind === 'hat') return drumHat(when, ev[2] || 0.04, tr.vol);
    if (tr.kind === 'snare') return drumSnare(when, tr.vol);
    if (tr.kind === 'kick') return drumKick(when, tr.vol);
    if (tr.kind === 'swell') return drumSwell(when, ev[2] || 0.6, tr.vol);
    const freq = hz(ev[1]);
    const g = audioCtx.createGain();
    const v = tr.vol;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(v, when + 0.01);
    g.gain.setValueAtTime(v, Math.max(when + 0.01, when + dur - 0.03));
    g.gain.linearRampToValueAtTime(0.0001, when + dur);
    const osc = audioCtx.createOscillator();
    osc.type = tr.wave === 'triangle' ? 'triangle' : 'square';
    if (tr.duty != null && osc.setPeriodicWave) {
      // имитация duty-cycle квадратной волны
      osc.setPeriodicWave(dutyWave(tr.duty));
    } else if (tr.wave === 'square') {
      osc.type = 'square';
    }
    osc.frequency.value = freq;
    if (tr.vib) {
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 5.5;
      const lg = audioCtx.createGain(); lg.gain.value = 5;
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start(when); lfo.stop(when + dur + 0.05);
    }
    osc.connect(g);
    g.connect(musicGain);
    if (tr.echo) { const e = audioCtx.createGain(); e.gain.value = 0.6; g.connect(e); e.connect(delayNode); }
    osc.start(when); osc.stop(when + dur + 0.05);
  }
};
let dutyWaves = {};
function dutyWave(d) {
  if (dutyWaves[d]) return dutyWaves[d];
  const n = 32, real = new Float32Array(n), imag = new Float32Array(n);
  for (let i = 1; i < n; i++) {

  const w = audioCtx.createPeriodicWave(real, imag, { disableNormalization: true });

  const f = audioCtx.createBiquadFilter();

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + dur);
  src.connect(f); f.connect(g); g.connect(musicGain);
  src.start(when); src.stop(when + dur + 0.02);

function drumSnare(when, vol) {
  const src = audioCtx.createBufferSource();
  src.buffer = getNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 1900;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.1);
  src.connect(f); f.connect(g); g.connect(musicGain);
  src.start(when); src.stop(when + 0.14);
  const o = audioCtx.createOscillator();
  o.type = 'triangle'; o.frequency.value = 210;
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(vol * 0.7, when);
  og.gain.exponentialRampToValueAtTime(0.001, when + 0.08);
  o.connect(og); og.connect(musicGain);
  o.start(when); o.stop(when + 0.1);
}
function drumKick(when, vol) {
  const o = audioCtx.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(110, when);
  o.frequency.exponentialRampToValueAtTime(45, when + 0.1);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.12);
  o.connect(g); g.connect(musicGain);
  o.start(when); o.stop(when + 0.14);
}
function drumSwell(when, dur, vol) {
  const src = audioCtx.createBufferSource();
  src.buffer = getNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.001, when);
  g.gain.linearRampToValueAtTime(vol, when + dur * 0.4);
  g.gain.linearRampToValueAtTime(0.001, when + dur);
  src.connect(f); f.connect(g); g.connect(musicGain);
  src.start(when); src.stop(when + dur + 0.05);

function bassTrack(chords, pattern) {
  // chords: [['D2','Dm'],...]; pattern: смещения по восьмым
  const ev = [];
  chords.forEach((c, bi) => {
    const base = c[0];
    for (let i = 0; i < 8; i++) {
      const off = pattern[i % pattern.length];
      ev.push([bi * 16 + i * 2, shiftNote(base, off), 2]);
    }
  });
  return ev;
}
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function shiftNote(n, semi) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const acc = m[2] === '#' ? 1 : (m[2] === 'b' ? -1 : 0);
  let midi = 12 * (+m[3] + 1) + NOTE_IDX[m[1]] + acc + semi;
  const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  return names[midi % 12] + (Math.floor(midi / 12) - 1);
}

  keys.forEach((k, bi) => {
    const tones = chordTones[k];
    for (let i = 0; i < 8; i++) {
      const idx = [0, 1, 2, 1, 0, 1, 2, 1][i];
      ev.push([bi * 16 + i * 2, tones[idx], 2]);
    }
  });

}

const P1_CHORDS = [['D2', 'Dm'], ['D2', 'Dm'], ['Bb1', 'Bb'], ['C2', 'C'],

];
function songStreet(opts) {
  opts = opts || {};
  const bassPat = [0, 0, 12, 0, 0, 7, 12, 7];
  const bassEv = bassTrack(P1_CHORDS, bassPat);
  const arpEv = arpTrack(P1_CHORDS.map(c => c[1]), CHORD_TONES);
  const hatEv = [];
  const snareEv = [], kickEv = [];
  for (let s = 0; s < 128; s++) {
    if (s % 2 === 0) hatEv.push([s, 'x', 1, s % 4 === 2]);
    if (s % 16 === 4 || s % 16 === 12) snareEv.push([s, 'x', 1]);
    if (s % 16 === 0 || s % 16 === 8) kickEv.push([s, 'x', 1]);
  }
  const tracks = [
    { kind: 'tone', wave: 'triangle', vol: 0.34, ev: bassEv },
    { kind: 'tone', wave: 'square', duty: 0.25, vol: 0.06, ev: arpEv },
    { kind: 'hat', vol: 0.05, ev: hatEv },
  ];
  if (!opts.noLead) tracks.push({ kind: 'tone', wave: 'square', duty: 0.5, vol: 0.15, echo: true, vib: true, ev: P1_LEAD });
  if (!opts.noDrums) tracks.push({ kind: 'snare', vol: 0.1, ev: snareEv });
  tracks.push({ kind: 'kick', vol: 0.3, ev: kickEv });

const P2_LEAD = [

function songDream() {
  const chords = [['D2', 'Dm'], ['F2', 'F'], ['C2', 'C'], ['G2', 'Gm'],
                  ['D2', 'Dm'], ['F2', 'F'], ['A1', 'A'], ['D2', 'Dm']];
  const bassEv = [];
  chords.forEach((c, bi) => {
    const b = shiftNote(c[0], 0);
    bassEv.push([bi * 16, b, 8]);
    bassEv.push([bi * 16 + 8, shiftNote(b, 7), 8]);
  });
  const padEv = [];
  const padRoots = { Dm: 'D4', F: 'F4', C: 'C4', Gm: 'G3', A: 'A3' };
  chords.forEach((c, bi) => {
    const r = padRoots[c[1]];
    padEv.push([bi * 16, r, 16]);
    padEv.push([bi * 16, shiftNote(r, 7), 16]);
  });
  const swellEv = [], kickEv = [];
  for (let b = 0; b < 8; b++) {
    swellEv.push([b * 16, 'x', 1.4]);
    kickEv.push([b * 16, 'x', 1]);
    kickEv.push([b * 16 + 8, 'x', 1]);
  }
  const tracks = [
    { kind: 'tone', wave: 'triangle', vol: 0.3, ev: bassEv },
    { kind: 'tone', wave: 'triangle', vol: 0.05, ev: padEv },
    { kind: 'tone', wave: 'square', duty: 0.5, vol: 0.11, echo: true, vib: true, ev: P2_LEAD },
    { kind: 'swell', vol: 0.05, ev: swellEv },
    { kind: 'kick', vol: 0.2, ev: kickEv },

/* ---------- SFX ---------- */
function sfx(fn) { if (audioCtx) fn(audioCtx.currentTime); }
function sfxJump() {
  sfx(t => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.duty = undefined;
    o.frequency.setValueAtTime(280, t);
    o.frequency.exponentialRampToValueAtTime(640, t + 0.1);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t + 0.16);
  });
}
function sfxCollect() {
  sfx(t => {
    [[1318, 0, 0.06], [1975, 0.06, 0.1]].forEach(p => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = p[0];
      g.gain.setValueAtTime(0.14, t + p[1]);
      g.gain.exponentialRampToValueAtTime(0.001, t + p[1] + p[2]);

function respawn() {

/* ---------- ФИЗИКА ФАЗЫ 1 ---------- */
function physics1() {
  const L = LEVEL1;
  const acc = 0.14, maxV = 1.6;
  if (!P.dead) {
    if (keys.left) { P.vx -= acc; P.face = -1; }
    if (keys.right) { P.vx += acc; P.face = 1; }
    P.vx = clamp(P.vx, -maxV, maxV);
    if (P.grounded && jp('jump')) { P.vy = -4.6; P.grounded = false; sfxJump(); makeParticles(P.x + 5, P.y + 20, 4, '#3c3850', 1); }
  }
  P.vy += 0.2;
  if (P.vy > 4.4) P.vy = 4.4;
  P.x += P.vx;
  P.y += P.vy;

  // земля (с учётом ям)
  P.grounded = false;
  if (P.vy >= 0 && P.y + P.h >= L.gy) {
    let overPit = false;
    for (const pit of L.pits) {
      if (P.x + P.w > pit[0] + 2 && P.x < pit[0] + pit[1] - 2) { overPit = true; break; }
    }
    if (!overPit || G.god) { P.y = L.gy - P.h; P.vy = 0; P.grounded = true; } // в режиме просмотра ямы становятся "мостами"
  }

  // твёрдые препятствия + авто-взбегание
  for (const s of solids) {
    if (!aabb(P.x, P.y, P.w, P.h, s.x, s.y, s.w, s.h)) continue;
    const pressing = (s.x > P.x && keys.right) || (s.x < P.x && keys.left);
    if (P.grounded && pressing && s.y >= P.y + P.h - 20) {
      P.y = s.y - P.h; P.vy = 0; P.grounded = true; sfxVault();
    } else if (P.vy > 0 && P.y + P.h - P.vy <= s.y + 2) {
      P.y = s.y - P.h; P.vy = 0; P.grounded = true;
    } else {
      // горизонтальный блок
      if (P.vx > 0) P.x = s.x - P.w; else if (P.vx < 0) P.x = s.x + s.w;
      P.vx = 0;
    }
  }

  // авто-скролл: камера толкает
  G.camX += G.scroll;
  if (P.x < G.camX + 2) P.x = G.camX + 2;
  if (P.x > G.camX + W - 14) P.x = G.camX + W - 14;
  P.x = Math.min(P.x, L.len - 20);

  // опасности
  if (!P.dead) {
    for (const hz2 of hazards) {
      if (hz2.type === 'tunnel') {
        if (aabb(P.x + 1, P.y, P.w - 2, 4, hz2.x, hz2.y, hz2.w, hz2.h + 2)) { die(); break; }
      } else if (hz2.type === 'pit') {
        if (P.y > L.gy + 6 && P.x + P.w > hz2.x && P.x < hz2.x + hz2.w) { die(); break; }
      } else {
        if (aabb(P.x + 1, P.y + 1, P.w - 2, P.h - 2, hz2.x, hz2.y, hz2.w, hz2.h)) { die(); break; }
      }
    }
    if (!P.dead && P.y > H + 6) {
      if (G.god) { P.y = L.gy - P.h; P.vy = 0; } else die();
    }
    // враги
    for (const e of enemies) {
      if (e.type === 'crow') {
        const cy = e.y + Math.sin(G.frame * 0.06 + e.ph) * 6;
        if (aabb(P.x + 1, P.y + 1, P.w - 2, P.h - 2, e.x + 1, cy + 1, 10, 6)) { die(); break; }
      } else if (e.type === 'dog') {
        const d = Math.abs(e.x - P.x);
        if (d < 130 && !P.dead) {
          e.vx = e.x > P.x ? -0.62 : 0.62;
        } else {
          e.vx = e.dir * 0.3;
          if (e.x < e.x0) e.dir = 1; if (e.x > e.x1) e.dir = -1;
        }
        e.x += e.vx;
        if (aabb(P.x + 1, P.y + 1, P.w - 2, P.h - 2, e.x + 2, L.gy - 10, 12, 9)) { die(); break; }
      }
    }
    // подбираемые карты
    for (const pk of pickups) {
      if (pk.got) continue;
      if (aabb(P.x, P.y, P.w, P.h, pk.x - 6, pk.y - 6, 12, 12)) {
        pk.got = true; G.cards++;
        sfxCollect();
        makeParticles(pk.x, pk.y, 6, '#7ce8a0', 1.6);
      }
    }
    // чекпоинт
    for (const cp of L.checkpoints) {
      if (G.respawnX < cp && P.x >= cp - 8) {
        G.respawnX = cp; sfxCheckpoint();
      }
    }
    // конец фазы
    if (P.x >= L.len - 26 && P.grounded) {
      G.state = 'CLEAR'; G.stateT = 0;
      SEQ.stop();
      sfxClear();
    }
  }
}

/* ---------- ФИЗИКА ФАЗЫ 2 (сон, парящая) ---------- */
function physics2() {
  const L = LEVEL2;
  if (!P.dead) {
    const acc = 0.11, maxV = 1.05;
    if (keys.left) { P.vx -= acc; P.face = -1; }
    if (keys.right) { P.vx += acc; P.face = 1; }
    P.vx *= 0.95;
    P.vx = clamp(P.vx, -maxV, maxV);
    if (jp('jump')) { P.vy = -1.75; sfxFlap(); makeParticles(P.x + 5, P.y + 18, 3, '#5c7c9c', 0.8); }
    const gliding = keys.jump && P.vy > 0;
    P.vy += gliding ? 0.014 : 0.05;
    P.vy = clamp(P.vy, -2.0, 1.7);
  }
  P.x += P.vx;
  P.y += P.vy;

  // платформы (только сверху)
  P.grounded = false;
  if (P.vy >= 0) {
    for (const s of solids) {
      const feetPrev = P.y + P.h - P.vy;
      if (feetPrev <= s.y + 3 && P.y + P.h >= s.y && P.x + P.w > s.x + 2 && P.x < s.x + s.w - 2) {
        P.y = s.y - P.h; P.vy = 0; P.grounded = true;
      }
    }
  }

  // течение сна
  G.camX += 0.9;
  if (P.x < G.camX + 4) P.x = G.camX + 4;
  if (P.x > G.camX + W - 16) P.x = G.camX + W - 16;
  P.x = Math.min(P.x, L.len - 20);

  if (!P.dead) {
    // смог
    for (const s of hazards) {
      const sx = s.x + Math.sin(G.frame * 0.014 * s.sp * 4 + s.ph) * 14;
      const sy = s.y + Math.sin(G.frame * 0.02 + s.ph) * 8;
      if (aabb(P.x + 1, P.y + 1, P.w - 2, P.h - 2, sx - s.r + 3, sy - s.r + 3, s.r * 2 - 6, s.r * 2 - 6)) { die(); break; }
    }
    // стаи
    if (!P.dead) for (const e of enemies) {
      e.x += Math.sin(G.frame * 0.03 + e.ph) * 0.8;
      const fy = e.y + Math.sin(G.frame * 0.05 + e.ph * 1.3) * 9;
      if (aabb(P.x + 1, P.y + 1, P.w - 2, P.h - 2, e.x + 1, fy + 1, 10, 6)) { die(); break; }
    }
    // глифы
    for (const pk of pickups) {
      if (pk.got) continue;
      if (aabb(P.x, P.y, P.w, P.h, pk.x - 7, pk.y - 7, 14, 14)) {
        pk.got = true; G.cards++;
        sfxCollect();
        makeParticles(pk.x, pk.y, 8, '#a8e8ff', 1.8);
      }
    }
    // чекпоинт
    for (const cp of L.checkpoints) {
      if (G.respawnX < cp && P.x >= cp - 8) { G.respawnX = cp; sfxCheckpoint(); }
    }
    // падение в туман: в режиме просмотра поднимаем на ближайшую платформу
    if (P.y > H + 8) {
      if (G.god) {
        const s = solids.find(p => p.x + p.w >= P.x);
        if (s) {
          P.x = clamp(P.x, s.x + 4, s.x + s.w - 12);
          P.y = s.y - P.h - 10;
        } else {
          // платформ впереди нет — парим на воздушном потоке до двери школы
          P.x = Math.max(P.x, G.camX + 60);
          P.y = 140;
        }
        P.vy = -0.6;
        G.glitchT = 8;
      } else die();
    }
    // финиш: дверь школы в небе
    if (P.x >= L.len - 30) {
      G.state = 'CLEAR'; G.stateT = 0;
      SEQ.stop();
      sfxBell();
    }
  }
}

/* ---------- ОБЩЕЕ ОБНОВЛЕНИЕ ФАЗЫ ---------- */
function updatePlay() {
  G.frame++;
  // след Сони
  trail.unshift([P.x, P.y, P.face]);
  if (trail.length > SONIA_DELAY + 2) trail.pop();
  if (P.dead) {
    P.deadT++;
    if (P.deadT > 55) respawn();
  } else {
    if (G.phase === 1) physics1(); else physics2();
  }
  // частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // NPC
  for (const n of npcs) {
    n.x += n.speed * n.dir;
    if (n.x < n.x0) n.dir = 1;
    if (n.x > n.x1) n.dir = -1;
  }
  // вороны фазы 1
  if (G.phase === 1) {
    for (const e of enemies) {
      if (e.type === 'crow') {
        e.x += e.dir * 0.55;
        if (e.x < e.x0) { e.x = e.x0; e.dir = 1; }
        if (e.x > e.x1) { e.x = e.x1; e.dir = -1; }
      }
    }
  }
  if (G.glitchT > 0) G.glitchT--;
}

function drawGround(g) {
  const L = LEVEL1;
  const gy = L.gy;
  const x0 = Math.floor(G.camX / TILE) * TILE - TILE;
  for (let x = x0; x < G.camX + W + TILE; x += TILE) {
    if (x < -TILE || x > L.len + 64) continue;
    const isPush = x >= L.pushFrom;
    // яма?
    let pit = false;
    for (const p of L.pits) if (x + TILE > p[0] + 2 && x < p[0] + p[1] - 2) pit = true;
    if (pit) {
      g.fillStyle = '#0a0a10'; g.fillRect(x, gy, TILE, 6);
      g.fillStyle = isPush ? '#2c2418' : '#1c1c26';
      g.fillRect(x, gy + 6, TILE, H - gy - 6);
      continue;
    }
    if (isPush) {
      g.fillStyle = '#3c3224'; g.fillRect(x, gy, TILE, 5);   // грунт
      g.fillStyle = '#2c2418'; g.fillRect(x, gy + 5, TILE, H - gy - 5);
      g.fillStyle = '#4c4030';
      const rnd = mulberry32(x * 31);
      for (let i = 0; i < 3; i++) g.fillRect(x + (rnd() * 14 | 0), gy + 1 + (rnd() * 3 | 0), 2, 1);
    } else {
      g.fillStyle = '#3c3c4c'; g.fillRect(x, gy, TILE, 4);   // асфальт
      g.fillStyle = '#2c2c3a'; g.fillRect(x, gy + 4, TILE, H - gy - 4);
      g.fillStyle = '#4c4c5c';
      if (x % 32 === 0) g.fillRect(x, gy + 1, TILE, 1);
    }
  }
}

/* ---------- HUD ---------- */
function clockStr() {
  let min;

  else min = 23 + Math.floor(clamp(P.x / LEVEL2.len, 0, 1) * 23);
  const h = 7 + Math.floor((40 + min) / 60);
  const m = (40 + min) % 60;
  return h + ':' + (m < 10 ? '0' : '') + m;
}

};

const STORY_PAGES = [
  ['БЛАГОВЕЩЕНСК. НОЯБРЬ.', '', '7:40 УТРА.', 'УЛИЦЫ ЕЩЁ СПЯТ.'],
  ['МИТЯ И СОНЯ, 6-Б КЛАСС,', 'ШКОЛА-14, ФРУНЗЕ 57.', '', 'ЗВОНОК ЧЕРЕЗ 50 МИНУТ.'],
  ['В СУМКЕ - КАРТОЧКИ', 'ПО КИТАЙСКОМУ.', '', 'ИХ НЕЛЬЗЯ ПОТЕРЯТЬ.'],
  ['НЕ КАСАЙСЯ ГРЯЗИ, ЛУЖ,', 'ВЕТОК И ВОРОН.', '', 'ЛЮБОЕ КАСАНИЕ - КОНЕЦ.'],
];

function startGame() {
  G.phase = 1; G.lives = 3; G.cards = 0; G.deaths = 0;
  G.state = 'CARD'; G.stateT = 0;
  buildLevel1();
  SEQ.stop();
}

function update(dt) {
  G.stateT++;
  const S = G.state;
  if (jp('mute')) toggleMute();
  if (jp('god')) {
    G.god = !G.god;
    if (G.god && G.lives <= 0) G.lives = 3;   // вернуться из поражения в просмотр
  }

  if (S === 'TITLE') {
    if (!SEQ.playing) SEQ.play(songStreet({ noLead: true, noDrums: true, bpm: 84 }));
    if (jp('start')) { startGame(); }
  } else if (S === 'STORY') {
    if (!SEQ.playing) SEQ.play(songStreet({ noLead: true, noDrums: true, bpm: 84 }));
    if (jp('start') || G.stateT > 200) {
      G.storyPage++;
      G.stateT = 0;
      if (G.storyPage >= STORY_PAGES.length) {
        startGame();
      }
    }
  } else if (S === 'CARD') {
    if (jp('start') || G.stateT > 110) {
      G.state = 'PLAY'; G.stateT = 0;
      G.frame = 0;
      SEQ.play(G.phase === 1 ? songStreet() : songDream());
    }
  } else if (S === 'PLAY') {
    if (jp('pause')) {
      G.paused = !G.paused;
      if (G.paused) SEQ.stop(); else SEQ.play(G.phase === 1 ? songStreet() : songDream());
    }
    if (!G.paused) updatePlay();
  } else if (S === 'CLEAR') {
    if (G.stateT === 60 && G.phase === 2) sfxBell();
    if (G.stateT > 150) {
      if (G.phase === 1) {
        G.phase = 2;
        G.state = 'CARD'; G.stateT = 0;
        buildLevel2();
      } else {
        G.state = 'END'; G.stateT = 0;
        SEQ.stop();
      }
    }
  } else if (S === 'END') {
    if (G.stateT === 20) sfxBell();
    if (jp('start') && G.stateT > 120) {
      G.state = 'TITLE'; G.stateT = 0;
    }
  } else if (S === 'GAMEOVER') {
    if (jp('start') && G.stateT > 90) {
      G.state = 'TITLE'; G.stateT = 0;
    }
  }
}

/* ---------- РЕНДЕР ЭКРАНОВ ---------- */
function drawTitle(g) {
  drawSky(g, 4, 150, SKY1);
  drawStarfield(g, G.frame, 50, 55);
  // силуэт школы и улицы
  drawStripParallax(g, farStrip1, 0, 0.02, 60);
  drawStripParallax(g, leninStrip, 2, 0.05, 74);
  g.drawImage(schoolImg, 64, 92);
  // логотип
  const t = G.frame;
  const wob = Math.sin(t * 0.02) * 1.5;
  drawTextS(g, 'ШКОЛА-14', Math.round((W - textW('ШКОЛА-14', 3)) / 2), 26 + wob, '#e8d8a0', 3, '#2c1c4c');
  drawTextS(g, 'ПУТЬ ЧЕРЕЗ КВАРТАЛ', 76, 58, '#8ca8d8', 1, '#101020');
  // дети
  g.drawImage(mitya.idle, 104, 168);
  g.drawImage(sonya.idle, 128, 168);
  // ворона летит
  const cx = ((t * 0.6) % 320) - 40;
  g.drawImage(t % 12 < 6 ? crowA : crowB, Math.floor(260 - cx), 40 + Math.sin(t * 0.05) * 4);
  if ((t / 30 | 0) % 2 === 0) textCS(g, 'НАЖМИ ENTER', 200, '#e8e8f0', 1);
  textCS(g, 'СТРЕЛКИ-ХОДЬБА  Z-ПРЫЖОК  M-ЗВУК', 214, '#5c5878', 1);
  if (G.god) {
    if ((t / 20 | 0) % 2 === 0) textCS(g, 'РЕЖИМ ПРОСМОТРА ВКЛЮЧЁН', 224, '#7ce8a0', 1);
    textCS(g, 'I-ОБЫЧНЫЙ РЕЖИМ  ИГРА ПОКАЖЕТ СЕБЯ САМА', 232, '#3c6858', 1);
  } else {
    textCS(g, 'I - РЕЖИМ ПРОСМОТРА (НЕУЯЗВИМ)', 224, '#3c5878', 1);
    textCS(g, '8-БИТ АТМОСФЕРНЫЙ ТРИБУТ', 232, '#3c3858', 1);
  }
}

function drawStory(g) {
  g.fillStyle = '#0a0918';
  g.fillRect(0, 0, W, H);
  drawStarfield(g, G.frame, 30, 77);
  const page = STORY_PAGES[Math.min(G.storyPage, STORY_PAGES.length - 1)];
  let y = 70;
  for (const line of page) {
    if (line) textCS(g, line, y, '#c8c8d8', 1);
    y += 14;
  }
  // портреты
  if (G.storyPage === 1) {
    g.drawImage(mitya.idle, 92, 150);
    g.drawImage(sonya.idle, 148, 150);
  } else if (G.storyPage === 2) {
    g.drawImage(cards[0], 96, 146);
    g.drawImage(cards[1], 116, 146);
    g.drawImage(cards[2], 136, 146);
    g.drawImage(cards[3], 156, 146);
  } else if (G.storyPage === 3) {
    g.drawImage(crowA, 120, 148);
  } else {
    g.drawImage(schoolImg, 64, 140);
  }
  if ((G.frame / 30 | 0) % 2 === 0) textCS(g, 'ENTER >', 224, '#5c5878', 1);
}

function drawCard(g) {
  g.fillStyle = '#0a0918';
  g.fillRect(0, 0, W, H);
  if (G.phase === 1) {
    textCS(g, 'ФАЗА 1-1', 96, '#8ca8d8', 2);
    textCS(g, 'УЛИЦА ЛЕНИНА', 130, '#e8d8a0', 1);
    textCS(g, '7:40 УТРА. ДВОЕ ИДУТ В ШКОЛУ.', 150, '#5c5878', 1);
  } else {
    textCS(g, 'ФАЗА 1-2', 96, '#8ca8d8', 2);
    textCS(g, 'СОН НАД КВАРТАЛОМ', 130, '#a8e8ff', 1);
    textCS(g, 'ПРЫГАЙ ВЫШЕ. СМОГ НЕ ЛЮБИТ.', 150, '#5c5878', 1);
  }
}

function drawClear(g) {
  g.fillStyle = '#0a0918';
  g.fillRect(0, 0, W, H);
  if (G.phase === 1) {
    textCS(g, 'УЛИЦА ПРОЙДЕНА', 100, '#e8d8a0', 1);
    textCS(g, 'ПУШКИНА ВСТРЕЧАЕТ ТИШИНОЙ...', 124, '#8ca8d8', 1);
  } else {
    textCS(g, 'СОН РАССЕИВАЕТСЯ', 100, '#a8e8ff', 1);
    textCS(g, 'ЗВОНОК. ШКОЛА-14 ЖДЁТ.', 124, '#8ca8d8', 1);
  }
}

function drawEnd(g) {
  // тёплое утро
  g.fillStyle = '#14102c'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1c1838'; g.fillRect(0, 60, W, 60);
  g.fillStyle = '#241c44'; g.fillRect(0, 120, W, 40);
  // рассветная полоса
  g.fillStyle = '#5c3c4c'; g.fillRect(0, 158, W, 14);
  g.fillStyle = '#7c4c48'; g.fillRect(0, 168, W, 12);
  drawStarfield(g, G.frame, 30, 99);
  g.drawImage(schoolImg, 64, 102);
  g.drawImage(mitya.idle, 110, 178);
  g.drawImage(sonya.idle, 134, 178);
  textCS(g, '8:26. УСПЕЛИ.', 30, '#e8d8a0', 2);
  const rank = G.cards >= CARD_TOTAL && G.deaths === 0 ? 'S' :
    (G.cards >= CARD_TOTAL * 0.8 && G.deaths <= 2 ? 'A' :
    (G.cards >= CARD_TOTAL * 0.5 ? 'B' : 'C'));
  textCS(g, 'КАРТЫ: ' + G.cards + '/' + CARD_TOTAL + '   ПАДЕНИЙ: ' + G.deaths, 64, '#c8c8d8', 1);
  textCS(g, 'ОЦЕНКА: ' + rank, 78, rank === 'S' ? '#e8d878' : '#8ca8d8', 1);
  if (G.stateT > 120 && (G.frame / 30 | 0) % 2 === 0) {
    textCS(g, 'ENTER - ЕЩЁ РАЗ', 216, '#5c5878', 1);
  }
  textCS(g, '6-Б, ВЫ СПРАВИЛИСЬ. УРОК НАЧИНАЕТСЯ.', 230, '#3c3858', 1);
}

function drawGameOver(g) {
  g.fillStyle = '#0a0918';
  g.fillRect(0, 0, W, H);
  drawStarfield(g, G.frame, 20, 33);
  textCS(g, 'ИГРА ОКОНЧЕНА', 92, '#c03048', 2);
  textCS(g, 'КВАРТАЛ ПОБЕДИЛ... ПОКА ЧТО.', 128, '#5c5878', 1);
  if (G.stateT > 90 && (G.frame / 30 | 0) % 2 === 0) textCS(g, 'ENTER - НАЗАД', 176, '#c8c8d8', 1);
}

function drawPause(g) {
  g.fillStyle = 'rgba(6,6,14,0.7)';
  g.fillRect(0, 0, W, H);
  textCS(g, 'ПАУЗА', 104, '#e8d8a0', 2);
  textCS(g, 'ENTER - ПРОДОЛЖИТЬ   M - ЗВУК', 136, '#8ca8d8', 1);
}

/* ---------- ГЛАВНЫЙ РЕНДЕР ---------- */
function render() {
  const g = ctx;
  const S = G.state;
  if (S === 'TITLE') {
    G.frame++;
    drawTitle(g);
  } else if (S === 'STORY') {
    G.frame++;
    drawStory(g);
  } else if (S === 'CARD') {
    drawCard(g);
  } else if (S === 'PLAY') {
    if (G.phase === 1) renderBG1(g); else renderBG2(g);
    if (G.phase === 1) renderWorld1(g); else renderWorld2(g);
    renderKids(g);
    renderParticles(g);
    renderDarkness(g);
    renderHUD(g);
    if (G.paused) drawPause(g);
    // глитч при возрождении
    if (G.glitchT > 0 && G.glitchT % 4 < 2) {
      g.fillStyle = 'rgba(192,48,40,0.12)';
      g.fillRect(0, 0, W, H);
    }
  } else if (S === 'CLEAR') {
    drawClear(g);
  } else if (S === 'END') {
    G.frame++;
    drawEnd(g);
  } else if (S === 'GAMEOVER') {
    drawGameOver(g);
  }
}

/* ---------- ЦИКЛ (фиксированный шаг 60fps) ---------- */
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= 16.666) {
    update(1);
    acc -= 16.666;
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- DEBUG URL-ПАРАМЕТРЫ ---------- */
const qs = new URLSearchParams(location.search);
if (qs.get('god') === '0') G.god = false;   // ?god=0 — обычный опасный режим
if (qs.get('state')) {
  const st = qs.get('state');
  if (st === 'PLAY1' || st === 'PLAY2' || st === 'END') {
    G.lives = 3; G.cards = 0; G.deaths = 0;
    if (st === 'PLAY1') {
      G.phase = 1; G.state = 'PLAY'; buildLevel1();
      if (qs.get('px')) { P.x = +qs.get('px'); G.camX = Math.max(0, P.x - 60); G.respawnX = 0; }
    } else if (st === 'PLAY2') {
      G.phase = 2; G.state = 'PLAY'; buildLevel2();
      if (qs.get('px')) { P.x = +qs.get('px'); G.camX = Math.max(0, P.x - 60); G.respawnX = 80; }
    } else {
      G.state = 'END'; G.cards = CARD_TOTAL; G.deaths = 0;
    }
  }
}

requestAnimationFrame(loop);

</script>
